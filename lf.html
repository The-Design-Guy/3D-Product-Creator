    if (JX) { const part = A.root.children.find(o => o.userData.iid === j.id); if (part) part.position.add(new THREE.Vector3(...C.move).multiplyScalar(35)); }
    controls.target.copy(cam.t); camera.position.copy(cam.pos); camera.near = 2; camera.far = 20000; camera.updateProjectionMatrix(); controls.update();
    LBL = C.labels(j);
  } else frame(A.root, opt.dir || [1, 0.5, 1.3], opt.pad || 1.0);
  applyColours(); bar(); side(); legend();
}
const VIEWS = { front:{ dir:[0, 0.05, 1] }, side:{ dir:[1, 0.05, 0] }, back:{ dir:[-0.6, 0.35, -1] }, iso:{ dir:[1, 0.5, 1.3] }, under:{ dir:[0.8, -0.35, 1.2], pad:0.75 } };
function bar() {
  const B = document.getElementById('bar'), on = (c) => (c ? 'on' : '');
  B.innerHTML = `<button data-v="assembly" class="${on(VIEW === 'assembly' && !CLOSE)}">הרכבה</button><button data-v="exploded" class="${on(VIEW === 'exploded')}">מפורק</button><span class="sep"></span>
    ${['front:חזית', 'side:צד', 'back:אחור', 'iso:איזומטרי', 'under:מלמטה'].map(x => { const [k, l] = x.split(':'); return `<button data-cam="${k}">${l}</button>`; }).join('')}
    <span class="sep"></span><span class="lab">תקריב:</span>${Object.entries(CLOSES).map(([k, c]) => `<button data-close="${k}" class="${on(CLOSE === k)}">${c.he}</button>`).join('')}
    ${CLOSE ? `<button id="jx" class="${on(JX)}">פירוק החיבור</button>` : ''}
    <span class="sep"></span><span class="lab">צבע:</span>${[['material', 'חומר'], ['component', 'רכיב'], ['status', 'סטטוס']].map(([k, l]) => `<button data-mode="${k}" class="${on(MODE === k)}">${l}</button>`).join('')}
    <button id="lb" class="${on(LABELS)}">תוויות</button>`;
  B.querySelectorAll('[data-v]').forEach(b => b.onclick = () => show(b.dataset.v));
  B.querySelectorAll('[data-cam]').forEach(b => b.onclick = () => show(VIEW === 'exploded' ? 'exploded' : 'assembly', VIEWS[b.dataset.cam]));
  B.querySelectorAll('[data-close]').forEach(b => b.onclick = () => { JX = false; show('assembly', { close:b.dataset.close }); });
  B.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { MODE = b.dataset.mode; applyColours(); bar(); legend(); });
  const jx = B.querySelector('#jx'); if (jx) jx.onclick = () => { JX = !JX; show('assembly', { close:CLOSE }); };
  B.querySelector('#lb').onclick = () => { LABELS = !LABELS; bar(); };
}
function legend() {
  const L = document.getElementById('legend'), hex = (n) => '#' + n.toString(16).padStart(6, '0');
  const items = MODE === 'component' ? Object.entries(COMP_COL).filter(([k]) => k !== 'footP').map(([k, c]) => [PC[k].he, c])
    : MODE === 'status' ? [['מאומת', STATUS_COL.verified], ['זמני', STATUS_COL.provisional], ['PENDING', STATUS_COL.pending], ['מדיניות', STATUS_COL.policy]] : [];
  L.innerHTML = items.map(([t, c]) => `<span><i style="background:${hex(c)}"></i>${t}</span>`).join('');
}
const ST_HE = { verified:'מאומת', provisional:'זמני', pending:'PENDING VERIFICATION', policy:'מדיניות' };
const stTag = (s) => `<span class="st ${s}">${ST_HE[s] || s}</span>`;
const fmt = (v) => Array.isArray(v) ? v.join(', ') : v;
function side() {
  const S = document.getElementById('side'), a = A || assemble(), B = bom(a.inst);
  const rows = Object.entries(PC).filter(([k]) => k !== 'footP').flatMap(([k, p]) => Object.values(p.dims).map(x => ({ comp:p.he, ...x })));
  const cnt = (s) => rows.filter(r => r.st === s).length;
  const grp = (s) => { const r = rows.filter(x => x.st === s); return r.length ? `<tr class="grp"><td colspan="4">${stTag(s)} ${r.length}</td></tr>` + r.map(x => `<tr><td>${x.comp}</td><td>${x.he}</td><td>${fmt(x.v)}</td><td><small>${x.src}</small></td></tr>`).join('') : ''; };
  S.innerHTML = `<div class="eng"><b>סטטוס: לא מאושר הנדסית</b><ul><li>אין הצגת עומס מותר או בטיחות לתצורה.</li><li>רכיבים זמניים: קליפ, קושרת, אלכסון, רגל – מודולים להחלפה.</li><li>גובהי המדפים להדגמה בלבד.</li></ul></div>
    <h2>נתונים: מאומת מול זמני</h2><div class="sum">${['verified', 'provisional', 'pending'].map(s => `${stTag(s)} ${cnt(s)}`).join(' ')}</div>
    <table><tr><th>רכיב</th><th>נתון</th><th>ערך</th><th>מקור</th></tr>${grp('verified')}${grp('provisional')}${grp('pending')}</table>
    <h2>רכיבים</h2>${Object.entries(PC).map(([k, p]) => `<div class="comp"><b>${p.he}</b> ${stTag(p.status)}${p.must ? ' <span class="st must">חובה</span>' : ''}${p.temp ? ' <span class="st provisional">מודול זמני</span>' : ''} <code>${p.sku}</code><p>${p.note}</p></div>`).join('')}
    <h2>מיקומי מדפים (להדגמה) ובדיקת הרכבה</h2><table><tr><th>מדף</th><th class="n">יעד</th><th class="n">חריץ #</th><th class="n">גובה מדף</th><th>בדיקה</th></tr>
    ${a.chk.map((c, i) => `<tr><td>${i + 1}</td><td class="n">${c.target}</td><td class="n">${c.k}</td><td class="n">${c.top.toFixed(1)}</td><td>${c.ok ? 'על הצעד, בלי התנגשות' : c.why}</td></tr>`).join('')}</table>
    <small>הגבהים נגזרים מהחריץ: מרכז החריץ − 38.5 (מושב הקליפ, PENDING) + 33. מיקום החריץ הראשון PENDING, כך שכל הגבהים יזוזו יחד כשיאומת.</small>
    <h2>BOM – הרכבת ייחוס</h2><table><tr><th>רכיב</th><th>מק"ט חוליות</th><th>יצרן</th><th class="n">פיזי</th><th class="n">לרכישה</th><th>מחיר</th></tr>
    ${B.map(r => `<tr><td>${r.he} ${stTag(r.status)}${r.must ? ' <span class="st must">חובה</span>' : ''}${r.note ? `<br><small>${r.note}</small>` : ''}</td><td><code>${r.sku}</code></td><td><code>${r.mfr || '—'}</code><br><small>שיוך לא מאומת</small></td><td class="n">${r.n}</td><td class="n">${r.buy == null ? '?' : r.buy}</td><td>${r.price == null ? '<span style="color:var(--pend)">חסר מחיר</span>' : r.price}</td></tr>`).join('')}</table>
    <h2>כללים</h2><table>${RULES.map(r => `<tr><td><b>${r.id}</b> ${r.he}<br><small>${r.src}</small></td><td>${stTag(r.status)}</td><td>${r.result(CFG, a.chk)}</td></tr>`).join('')}</table>
    <h2>שאלות פתוחות</h2><ul>${UNKNOWN.map(u => `<li>${u}</li>`).join('')}</ul>
    <h2>מקורות</h2><ul>${Object.values(SRC).map(s => `<li>${s}</li>`).join('')}</ul>`;
}
// hover: what each part is
const ray = new THREE.Raycaster(), tip = document.getElementById('tip');
cv.addEventListener('pointermove', (e) => {
  if (!A) { tip.style.display = 'none'; return; }
  const r = cv.getBoundingClientRect(); ray.setFromCamera({ x:(e.clientX - r.left) / r.width * 2 - 1, y:-(e.clientY - r.top) / r.height * 2 + 1 }, camera);
  const h = ray.intersectObjects(A.root.children, true).find(x => x.object.isMesh && !(x.object.material && x.object.material.transparent && x.object.material.opacity < 0.3));
  const i = h && A.inst.find(x => x.id === h.object.userData.iid);
  if (!i) { tip.style.display = 'none'; return; }
  const p = PC[i.comp]; tip.innerHTML = `<b>${i.id}</b> · ${p.he}<br>מק"ט ${p.sku} · הורה: ${i.parent}<br>סטטוס: ${ST_HE[p.status]}${p.temp ? ' · מודול זמני' : ''}`; tip.style.display = 'block';
  tip.style.left = (e.clientX - r.left + 14) + 'px'; tip.style.top = (e.clientY - r.top + 14) + 'px';
});
cv.addEventListener('click', () => { const t = tip.style.display === 'block' && tip.querySelector('b'); SEL = t ? (SEL === t.textContent ? null : t.textContent) : null; applyColours(); });
// labels follow their 3D points
const tmp = new THREE.Vector3();
function drawLabels() {
  if (!LABELS || !LBL.length) { if (lblEl.childElementCount) lblEl.innerHTML = ''; return; }
  if (lblEl.childElementCount !== LBL.length) lblEl.innerHTML = LBL.map(l => `<div class="l ${l.st}">${l.t}</div>`).join('');
  const r = cv.getBoundingClientRect();
  LBL.forEach((l, i) => { tmp.copy(l.p).project(camera); const el = lblEl.children[i];
    el.style.display = tmp.z > 1 ? 'none' : ''; el.style.left = ((tmp.x + 1) / 2 * r.width) + 'px'; el.style.top = ((1 - tmp.y) / 2 * r.height - 4) + 'px'; });
}
window.__LF = { show, VIEWS, CLOSES, assemble, bom, PC, MODULES, renderer, setMode:(m) => { MODE = m; applyColours(); bar(); legend(); }, setJX:(v) => { JX = v; } };
resize(); const q = new URLSearchParams(location.search); show(q.get('v') || 'assembly', q.get('close') ? { close:q.get('close') } : {});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); drawLabels(); });
</script>
